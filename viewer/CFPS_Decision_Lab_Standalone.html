</style></head><body style="margin:0"><div id="cfps-root"></div><script>/* HTGAA CFPS Decision Lab: private, client-side, deterministic selection and physical plate map.
   No network writes, credentials, cross-origin analytics or third-party dependencies.
   This is a suggested plan, never a validated robot execution file. */
(function(root) {
'use strict';
const PROTEINS=['sfGFP','PETase','Reteplase'], ROLE={'first run':0,'check run':1,'sweep run':2,'independent run':3};
const ROWS='ABCDEFGHIJKLMNOP'.split(''), expWells=Array.from({length:20},(_,c)=>c+5).flatMap(c=>ROWS.map(r=>r+String(c).padStart(2,'0')));
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(x, fallback=0)=>{const n=Number(x);return Number.isFinite(n)?n:fallback};
const chooseCount=(cfg)=>cfg.quotaMode==='wells'?(cfg.gpWells%cfg.reps?NaN:cfg.gpWells/cfg.reps):Math.floor((320/cfg.reps)*cfg.gpPercent/100+.5);
const uniqCapacity=cfg=>320/cfg.reps;
function distanceMatrix(cands){const n=cands.length, data=new Float32Array(n*n);let max=0;for(let i=0;i<n;i++){for(let j=0;j<i;j++){const a=cands[i].features,b=cands[j].features;let s=0;for(let k=0;k<a.length;k++){const z=a[k]-b[k];s+=z*z}const d=Math.sqrt(s);data[i*n+j]=data[j*n+i]=d;if(d>max)max=d}}for(let i=0;i<data.length;i++)data[i]/=max||1;return data}
function gpScores(cands,cfg){const fields=[['pBeat',cfg.gpYield,1],['lnSpecCost',cfg.gpCost,-1],['sd',cfg.gpSD,1]],denom=fields.reduce((s,x)=>s+x[1],0);const scores=new Float64Array(cands.length);if(!denom)return scores;
  for(const [field,w,sign] of fields){if(!w)continue;const vals=cands.map((c,i)=>({i,v:Number(c.forecast?.[field])})).filter(o=>cands[o.i].forecast?.[field]!=null&&Number.isFinite(o.v)).sort((a,b)=>a.v-b.v||a.i-b.i);if(vals.length<2||vals[0].v===vals[vals.length-1].v)continue;vals.forEach((o,r)=>scores[o.i]+=(w/denom)*(sign>0?r/(vals.length-1):1-r/(vals.length-1)));}return scores}
function partialSets(p,selected){const warnings=[];for(const [kind,key,severity] of [['submitted_batch','submission_batches','high'],['published_gp_group','published_groups','info'],['model_sweep','sweep_families','medium']])for(const g of p[key]||[]){const inS=g.ids.filter(x=>selected.has(x));const miss=g.ids.filter(x=>!selected.has(x));if(inS.length&&miss.length)warnings.push({kind,severity,name:g.name,nSelected:inS.length,total:g.ids.length,missing:miss,mandatory:kind==='submitted_batch'})}for(const g of p.submission_batches||[]){if(!g.ids.some(x=>selected.has(x)))continue;if(g.reported_sizes_disagree||g.possible_missing_source_members>0)warnings.push({kind:'source_batch_incomplete',severity:'high',name:g.name,nSelected:g.ids.filter(x=>selected.has(x)).length,total:g.reported_size||'? ',missing:[],mandatory:true,sourceMissing:g.possible_missing_source_members||0})}return warnings}
function solve(input,target,cfg,manual,cache){const p=input.targets[target],cands=p.candidates,n=cands.length,capacity=uniqCapacity(cfg),gq=chooseCount(cfg),mq=capacity-gq;
 if(!Number.isInteger(capacity)||!Number.isInteger(gq)||gq<0||gq>capacity)throw Error('Invalid quota: GP wells must be divisible by replicate factor');
 if(capacity>n)throw Error(`Insufficient distinct submitted formulations (${n} available for ${capacity} conditions)`);
 if(gq&&!p.source_has_gp_annotations)throw Error('This source lacks published GP annotations. Set GP share to zero.');
 const idx=Object.fromEntries(cands.map((c,i)=>[c.id,i]));const overrides=manual[target]?.slots||{},excluded=new Set(manual[target]?.excluded||[]);
 const fixedGP=[],fixedMF=[],fixedSlots=[];
 for(const [key,id] of Object.entries(overrides)){const slot=Number(key);if(!Number.isInteger(slot)||slot<0||slot>=capacity||idx[id]===undefined)continue;const m=slot<gq?'gp':'model_free';(m==='gp'?fixedGP:fixedMF).push(id);fixedSlots.push({slot,id,method:m})}
 if(new Set(fixedSlots.map(x=>x.id)).size!==fixedSlots.length)throw Error('One manually chosen submission is assigned to multiple slots.');
 if(fixedGP.length>gq||fixedMF.length>mq)throw Error('Manual assignments exceed the quota.');
 for(const id of fixedGP.concat(fixedMF))excluded.delete(id);
 if(n-excluded.size<capacity)throw Error('Too many exclusions for this plate capacity');
 const selected=new Set([...fixedGP,...fixedMF]);const gp=fixedGP.slice(),mf=fixedMF.slice(),extensions=[];
 const scores=gpScores(cands,cfg);const avail=cands.map((c,i)=>i).filter(i=>!selected.has(cands[i].id)&&!excluded.has(cands[i].id));
 const rank=i=>Math.min(99,...(cands[i].roles||[]).map(x=>ROLE[x]??99));
 avail.sort((a,b)=> (cfg.gpPolicy==='published_designations'?rank(a)-rank(b):0)||scores[b]-scores[a]||cands[a].id.localeCompare(cands[b].id));
 for(const i of avail){if(gp.length>=gq)break;let id=cands[i].id;gp.push(id);selected.add(id);if(!(cands[i].roles||[]).length)extensions.push(id)}
 if(gp.length!==gq)throw Error('GP quota cannot be filled');
 const D=cache[target]||(cache[target]=distanceMatrix(cands)),nearest=new Float64Array(n).fill(1);
 for(const id of selected){const i=idx[id];for(let j=0;j<n;j++)nearest[j]=Math.min(nearest[j],D[i*n+j])}
 while(mf.length<mq){let best=-1,bestScore=-Infinity;
   for(let i=0;i<n;i++){const id=cands[i].id;if(selected.has(id)||excluded.has(id))continue;let value=nearest[i];if(cfg.objective!=='maximin'){let gain=0;for(let j=0;j<n;j++)gain+=Math.max(0,nearest[j]-D[i*n+j]);gain/=n;value=cfg.objective==='facility_location'?gain:cfg.geoWeight*value+(1-cfg.geoWeight)*gain}
     if(value>bestScore+1e-10||(Math.abs(value-bestScore)<1e-10&&(best<0||id<cands[best].id))){best=i;bestScore=value}}
   if(best<0)throw Error('No eligible model-free candidates');const id=cands[best].id;selected.add(id);mf.push(id);for(let j=0;j<n;j++)nearest[j]=Math.min(nearest[j],D[best*n+j]);
 }
 // Moving conditions within their method partition preserves both exact quotas and replicate blocks.
 const order=[...gp.map(id=>({id,method:'gp'})),...mf.map(id=>({id,method:'model_free'}))];
 for(const {slot,id,method} of fixedSlots.sort((a,b)=>a.slot-b.slot)){const found=order.findIndex(x=>x.id===id);if(found<0||order[found].method!==method)throw Error('Manual assignment has inconsistent quota');[order[slot],order[found]]=[order[found],order[slot]]}
 const assignments=order.flatMap((o,s)=>Array.from({length:cfg.reps},(_,r)=>({well:expWells[s*cfg.reps+r],id:o.id,method:o.method,replicate:r+1,slot:s})));
 const warnings=partialSets(p,selected),coverage=nearest.reduce((a,b)=>a+b,0)/n;
 return {target,capacity,gpQuota:gq,mfQuota:mq,gpWells:gq*cfg.reps,mfWells:mq*cfg.reps,order,assignments,warnings,extensions,coverage,selected:[...selected].sort(),config:{...cfg},excluded:[...excluded],manualSlots:{...overrides},privacy:'PRIVATE',status:'PROVISIONAL — verify sample replication, group integrity, and laboratory execution constraints'};
}
function defaultConfig(){return {reps:4,quotaMode:'percent',gpPercent:50,gpWells:160,gpPolicy:'published_designations',objective:'maximin',geoWeight:.5,gpYield:.6,gpCost:.25,gpSD:.15}}
function state(){return {input:null,cfg:defaultConfig(),manual:Object.fromEntries(PROTEINS.map(p=>[p,{slots:{},excluded:[]}])),plans:{},cache:{},active:null,search:'',error:'',showAllWarnings:false,sourceName:''}}
const stats=p=>`<span class="dl-number">${p.capacity}</span> formulations · <b>${p.gpQuota}</b> GP / <b>${p.mfQuota}</b> model-free · ${p.gpWells}+${p.mfWells} wells`;
function plateHTML(target,p,st){let lookup=Object.fromEntries(p.assignments.map(a=>[a.well,a])),nWarn=p.warnings.filter(w=>w.severity!=='info').length;
 let grid='<div class="dl-plate-grid"><span class="dl-corner"></span>'+Array.from({length:24},(_,i)=>`<span class="dl-colhead ${i<4?'reserved':''}">${i+1}</span>`).join('');
 for(const r of ROWS){grid+=`<span class="dl-rowhead">${r}</span>`;for(let col=1;col<=24;col++){const well=r+String(col).padStart(2,'0'),a=lookup[well],kind=col<=4?'reserved':a?.method==='gp'?'gp':'free',sel=st.active?.target===target&&st.active?.well===well?' active':'',fixed=a&&st.manual[target].slots[a.slot]?' pinned':'';
 const title=col<=4?`${well}: reserved for standards/controls`:a?`${well} · ${a.id} · ${a.method} · replicate ${a.replicate}/${st.cfg.reps}`:`${well}: empty`;
 grid+=`<button type="button" class="dl-well ${kind}${sel}${fixed}" data-well="${well}" data-target="${target}" title="${esc(title)}" ${col<=4?'disabled':''} aria-label="${esc(title)}"></button>`}}
 grid+='</div>';
